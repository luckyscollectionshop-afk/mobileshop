<svg
  width="420"
  height="260"
  viewBox="0 0 420 260"
  xmlns="http://www.w3.org/2000/svg"
>
 <!-- Deep Black Background -->
  <rect width="800" height="800" fill="#0D0D0D"/>
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A6418"/>
      <stop offset="25%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#F5D76E"/>
      <stop offset="75%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#8A6418"/>
    </linearGradient>
  </defs>

  <!-- Top luxury curve -->
  <path
    d="M 55 78
       C 105 32, 315 32, 365 78"
    fill="none"
    stroke="url(#gold)"
    stroke-width="3"
    stroke-linecap="round"
  />

  <!-- Upper decorative taper -->
  <path
    d="M 82 69
       C 135 42, 285 42, 338 69"
    fill="none"
    stroke="url(#gold)"
    stroke-width="1.2"
    stroke-linecap="round"
    opacity="0.75"
  />

  <!-- Main lettering -->
  <text
    x="210"
    y="112"
    text-anchor="middle"
    fill="url(#gold)"
    font-family="cursive"
    font-size="34"
    font-style="italic"
    font-weight="500"
    letter-spacing="1"
  >
    Lucky
  </text>

  <text
    x="210"
    y="151"
    text-anchor="middle"
    fill="url(#gold)"
    font-family="cursive"
    font-size="34"
    font-style="italic"
    font-weight="500"
    letter-spacing="1"
  >
    Charm
  </text>

  <text
    x="210"
    y="190"
    text-anchor="middle"
    fill="url(#gold)"
    font-family="cursive"
    font-size="34"
    font-style="italic"
    font-weight="500"
    letter-spacing="1"
  >
    Creations
  </text>

  <!-- Bottom curve — vertically mirrored from top -->
  <path
    d="M 55 182
       C 105 228, 315 228, 365 182"
    fill="none"
    stroke="url(#gold)"
    stroke-width="3"
    stroke-linecap="round"
  />

  <!-- Lower decorative taper -->
  <path
    d="M 82 191
       C 135 218, 285 218, 338 191"
    fill="none"
    stroke="url(#gold)"
    stroke-width="1.2"
    stroke-linecap="round"
    opacity="0.75"
  />
</svg>